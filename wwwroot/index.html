<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ministry of Flat Http</title>
    <link href="lib/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card col-12 col-lg-9 col-xl-8 border-secondary bg-dark shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h1 class="display-6 fw-bold mb-2">Unwrap an OBJ mesh</h1>
                    <p class="text-secondary mb-0">Drop a Wavefront OBJ below and download a copy with generated UV coordinates.</p>
                </div>

                <form id="unwrap-form" novalidate>
                    <label id="drop-zone" class="border border-2 border-secondary rounded-3 d-flex flex-column align-items-center justify-content-center text-center p-4 mb-3" for="file-input" tabindex="0">
                        <span class="badge bg-dark border border-info rounded-3 text-info fs-5 p-3 mb-3">OBJ</span>
                        <span class="fs-5 fw-bold">Drop your mesh here</span>
                        <span class="text-secondary mt-1">or click to choose a file</span>
                        <span id="file-details" class="small text-info mt-3" hidden></span>
                    </label>
                    <input id="file-input" class="visually-hidden" type="file" accept=".obj" required>

                    <div id="status" class="alert mb-3" role="status" aria-live="polite" hidden></div>

                    <button id="submit-button" class="btn btn-info btn-lg w-100 fw-bold" type="submit" disabled>
                        Unwrap mesh
                    </button>
                </form>
            </div>
            <div class="card-footer border-secondary bg-dark px-4 px-md-5 py-3 text-secondary small d-flex flex-column flex-sm-row justify-content-between gap-2">
                <span>Default unwrap settings</span>
                <a class="text-secondary text-decoration-none" href="/swagger/">API specification</a>
            </div>
        </section>
    </main>

    <script>
        const form = document.querySelector("#unwrap-form");
        const dropZone = document.querySelector("#drop-zone");
        const fileInput = document.querySelector("#file-input");
        const fileDetails = document.querySelector("#file-details");
        const status = document.querySelector("#status");
        const submitButton = document.querySelector("#submit-button");
        let selectedFile = null;

        function showStatus(message, kind) {
            status.textContent = message;
            status.className = `alert alert-${kind} mb-3`;
            status.hidden = false;
        }

        function selectFile(file) {
            if (!file || file.size === 0 || !file.name.toLowerCase().endsWith(".obj")) {
                selectedFile = null;
                fileDetails.hidden = true;
                submitButton.disabled = true;
                showStatus("Choose a nonempty .obj file.", "danger");
                return;
            }

            selectedFile = file;
            fileDetails.textContent = `${file.name} (${formatBytes(file.size)})`;
            fileDetails.hidden = false;
            submitButton.disabled = false;
            status.hidden = true;
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} bytes`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        async function readError(response) {
            try {
                const problem = await response.json();
                if (problem.errors) return Object.values(problem.errors).flat().join(" ");
                return problem.detail || problem.title || `Request failed (${response.status}).`;
            } catch {
                return `Request failed (${response.status}).`;
            }
        }

        fileInput.addEventListener("change", () => selectFile(fileInput.files[0]));

        for (const eventName of ["dragenter", "dragover"]) {
            dropZone.addEventListener(eventName, event => {
                event.preventDefault();
                dropZone.classList.remove("border-secondary");
                dropZone.classList.add("border-info", "bg-secondary");
            });
        }

        for (const eventName of ["dragleave", "drop"]) {
            dropZone.addEventListener(eventName, event => {
                event.preventDefault();
                dropZone.classList.remove("border-info", "bg-secondary");
                dropZone.classList.add("border-secondary");
            });
        }

        dropZone.addEventListener("drop", event => selectFile(event.dataTransfer.files[0]));
        dropZone.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                fileInput.click();
            }
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (!selectedFile) return;

            const data = new FormData();
            data.append("File", selectedFile, selectedFile.name);
            submitButton.disabled = true;
            submitButton.textContent = "Unwrapping...";
            showStatus("Uploading and generating UV coordinates. This may take a moment.", "info");

            try {
                const response = await fetch("/api/unwrap", { method: "POST", body: data });
                if (!response.ok) throw new Error(await readError(response));

                const output = await response.blob();
                const url = URL.createObjectURL(output);
                const download = document.createElement("a");
                const baseName = selectedFile.name.replace(/\.obj$/i, "");
                download.href = url;
                download.download = `${baseName}-unwrapped.obj`;
                download.click();
                URL.revokeObjectURL(url);
                showStatus("Unwrap complete. Your OBJ download has started.", "success");
            } catch (error) {
                showStatus(error.message || "The mesh could not be unwrapped.", "danger");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Unwrap mesh";
            }
        });
    </script>
</body>
</html>
