<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ministry of Flat Http</title>
    <link href="/lib/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <section class="card col-12 col-lg-9 col-xl-8 border-secondary bg-dark shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h1 class="display-6 fw-bold mb-2">Unwrap an OBJ mesh</h1>
                    <p class="text-secondary mb-0">Drop a Wavefront OBJ below and download a copy with generated UV coordinates.</p>
                </div>

                <form id="unwrap-form" novalidate>
                    <label id="drop-zone" class="border border-2 border-secondary rounded-3 d-flex flex-column align-items-center justify-content-center text-center p-4 mb-3" for="file-input" tabindex="0">
                        <span class="badge bg-dark border border-info rounded-3 text-info fs-5 p-3 mb-3">OBJ</span>
                        <span class="fs-5 fw-bold">Drop your mesh here</span>
                        <span class="text-secondary mt-1">or click to choose a file</span>
                        <span id="file-details" class="small text-info mt-3" hidden></span>
                    </label>
                    <input id="file-input" class="visually-hidden" type="file" accept=".obj" required>

                    <div id="status" class="alert mb-3" role="status" aria-live="polite" hidden></div>

                    <button id="submit-button" class="btn btn-info btn-lg w-100 fw-bold" type="submit" disabled>
                        Unwrap mesh
                    </button>
                </form>
            </div>
            <div class="card-footer border-secondary bg-dark px-4 px-md-5 py-3 text-secondary small d-flex flex-column flex-sm-row justify-content-between gap-2">
                <span>Default unwrap settings</span>
                <a class="text-secondary text-decoration-none" href="/swagger/">API specification</a>
            </div>
        </section>
    </main>

    <script src="/js/index.js"></script>
</body>
</html>
