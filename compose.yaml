services:
  mof:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:${MOF_HTTP_PORT:-5000}:8080"
    volumes:
      - mof-binaries:/data/MOFBinary
    environment:
      MinistryOfFlat__TimeoutSeconds: "120"
      MinistryOfFlat__MaxConcurrentProcesses: "2"
      # Uncomment to password-protect the UI and API. Prefer a local .env file or Docker secrets for the value.
      # ApiPassword: "change-me"
    restart: unless-stopped
    stop_grace_period: 30s
    # Each unwrap slot can hold a Wine process plus a large mesh in flight; cap memory
    # so concurrent requests degrade to 503/504 instead of OOM-killing the host.
    mem_limit: 4g

volumes:
  mof-binaries:
