app = "mof-http"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
MinistryOfFlat__TimeoutSeconds = "120"
MinistryOfFlat__MaxConcurrentProcesses = "8"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 16

[[http_service.checks]]
grace_period = "1m"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
